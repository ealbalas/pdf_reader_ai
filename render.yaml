services:
  - type: web
    name: pdf-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.web:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.web
      - key: REDIS_URL
        fromService:
          name: pdf-redis
          type: redis
          property: connectionString

  - type: worker
    name: pdf-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.web
      - key: REDIS_URL
        fromService:
          name: pdf-redis
          type: redis
          property: connectionString

  - type: redis
    name: pdf-redis
    ipAllowList: [] 